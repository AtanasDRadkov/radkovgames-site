<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Radkov Games — simple, polished games for iPhone.">
  <title>Radkov Games</title>

  <style>
    :root {
      color-scheme: light dark;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: #0f1115;
      color: #f5f5f7;
    }

    main {
      width: min(760px, calc(100% - 40px));
      margin: auto;
      padding: 80px 0;
    }

    h1 {
      font-size: clamp(44px, 9vw, 76px);
      margin: 0 0 12px;
      letter-spacing: -0.04em;
    }

    .tagline {
      font-size: 21px;
      color: #b7bac2;
      margin-bottom: 64px;
    }

    section {
      margin-top: 48px;
    }

    h2 {
      font-size: 24px;
      margin-bottom: 12px;
    }

    p {
      line-height: 1.6;
      color: #c8cad0;
    }

    a {
      color: #7db7ff;
    }

    footer {
      width: min(760px, calc(100% - 40px));
      margin: 0 auto;
      padding: 24px 0 40px;
      color: #858892;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <main>
    <h1>Radkov Games</h1>
    <div class="tagline">Simple games, thoughtfully made.</div>

    <section>
      <h2>Games</h2>
      <p><strong>Conveyor Switch Sort</strong><br>
      Coming soon for iPhone.</p>
    </section>

    <section>
      <h2>Support</h2>
      <p>Need help with one of our games?<br>
      Email <a href="mailto:support@radkovgames.com">support@radkovgames.com</a>.</p>
    </section>
  </main>

<footer>
  © 2026 Radkov Games ·
  <a href="/support/">Support</a> ·
  <a href="/privacy/">Privacy</a>
</footer>
</body>
</html>
